<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Content Management</title>

<style>

body{
font-family:Arial;
margin:40px;
background:#f4f6f9;
}

table{
width:100%;
background:white;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<h1>Content Management</h1>

<a href="index.html">Back to Dashboard</a>

<h2>Content List</h2>

<table>

<thead>
<tr>
<th>Title</th>
<th>Division</th>
<th>Platform</th>
<th>Status</th>
</tr>
</thead>

<tbody id="contentTable"></tbody>

</table>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
"https://fzplvluohnbuggvdqkkw.supabase.co",
"YOUR_SUPABASE_KEY"
)

async function loadContent(){

const { data } = await supabase
.from("content_plan")
.select("*")

let table = document.getElementById("contentTable")

data.forEach(item => {

table.innerHTML += `
<tr>
<td>${item.title ?? ""}</td>
<td>${item.division ?? ""}</td>
<td>${item.platform ?? ""}</td>
<td>${item.status ?? ""}</td>
</tr>
`

})

}

loadContent()

</script>

</body>
</html>
