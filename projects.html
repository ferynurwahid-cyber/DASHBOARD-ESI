<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Projects Management</title>

<style>

body{
font-family:Arial;
margin:40px;
background:#f4f6f9;
}

h1{
margin-bottom:10px;
}

input{
padding:8px;
margin:5px;
}

button{
padding:8px 12px;
cursor:pointer;
}

table{
width:100%;
background:white;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#f1f5f9;
}

</style>

</head>

<body>

<h1>Projects Management</h1>

<a href="index.html">⬅ Back to Dashboard</a>

<h2>Add Project</h2>

<input id="name" placeholder="Project Name">
<input id="client" placeholder="Client">
<input id="status" placeholder="Status">

<button onclick="addProject()">Add</button>

<h2>Project List</h2>

<table>

<thead>
<tr>
<th>Project</th>
<th>Client</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="projectTable"></tbody>

</table>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
"https://fzplvluohnbuggvdqkkw.supabase.co",
"YOUR_SUPABASE_ANON_KEY"
)

async function loadProjects(){

const { data } = await supabase
.from("projects")
.select("*")

let table = document.getElementById("projectTable")
table.innerHTML=""

data.forEach(p=>{

table.innerHTML += `
<tr>

<td contenteditable="true"
onblur="updateProject('${p.id}','project_name',this.innerText)">
${p.project_name ?? ""}</td>

<td contenteditable="true"
onblur="updateProject('${p.id}','client_name',this.innerText)">
${p.client_name ?? ""}</td>

<td contenteditable="true"
onblur="updateProject('${p.id}','project_status',this.innerText)">
${p.project_status ?? ""}</td>

<td>
<button onclick="deleteProject('${p.id}')">Delete</button>
</td>

</tr>
`

})

}

window.addProject = async function(){

let name = document.getElementById("name").value
let client = document.getElementById("client").value
let status = document.getElementById("status").value

await supabase
.from("projects")
.insert([{
project_name:name,
client_name:client,
project_status:status
}])

loadProjects()

}

window.updateProject = async function(id,column,value){

await supabase
.from("projects")
.update({ [column]: value })
.eq("id",id)

}

window.deleteProject = async function(id){

await supabase
.from("projects")
.delete()
.eq("id",id)

loadProjects()

}

loadProjects()

</script>

</body>
</html>
