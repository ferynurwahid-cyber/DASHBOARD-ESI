<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>RFI Tracker</title>

<style>

body{
font-family:Arial;
margin:40px;
background:#f4f6f9;
}

input{
padding:8px;
margin:5px;
}

button{
padding:8px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<h1>RFI Tracker</h1>

<a href="index.html">Back to Dashboard</a>

<h2>Add RFI</h2>

<input id="number" placeholder="RFI Number">
<input id="title" placeholder="Title">
<input id="sender" placeholder="Sender">
<input id="status" placeholder="Status">

<button onclick="addRFI()">Add</button>

<table>

<thead>
<tr>
<th>Number</th>
<th>Title</th>
<th>Sender</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="rfiTable"></tbody>

</table>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
"https://fzplvluohnbuggvdqkkw.supabase.co",
"YOUR_SUPABASE_KEY"
)

async function loadRFI(){

const { data } = await supabase
.from("rfi_inquiries")
.select("*")

let table = document.getElementById("rfiTable")
table.innerHTML=""

data.forEach(r=>{

table.innerHTML += `
<tr>

<td contenteditable="true"
onblur="updateRFI('${r.id}','rfi_number',this.innerText)">
${r.rfi_number ?? ""}</td>

<td contenteditable="true"
onblur="updateRFI('${r.id}','inquiry_title',this.innerText)">
${r.inquiry_title ?? ""}</td>

<td contenteditable="true"
onblur="updateRFI('${r.id}','sender',this.innerText)">
${r.sender ?? ""}</td>

<td contenteditable="true"
onblur="updateRFI('${r.id}','status',this.innerText)">
${r.status ?? ""}</td>

<td>
<button onclick="deleteRFI('${r.id}')">Delete</button>
</td>

</tr>
`

})

}

window.addRFI = async function(){

let number = document.getElementById("number").value
let title = document.getElementById("title").value
let sender = document.getElementById("sender").value
let status = document.getElementById("status").value

await supabase
.from("rfi_inquiries")
.insert([{

rfi_number:number,
inquiry_title:title,
sender:sender,
status:status

}])

loadRFI()

}

window.updateRFI = async function(id,column,value){

await supabase
.from("rfi_inquiries")
.update({ [column]: value })
.eq("id",id)

}

window.deleteRFI = async function(id){

await supabase
.from("rfi_inquiries")
.delete()
.eq("id",id)

loadRFI()

}

loadRFI()

</script>

</body>
</html>
